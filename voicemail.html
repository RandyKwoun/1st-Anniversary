            { file: "08-people", title: "인간관계 때문에 힘들 때", duration: 50.64, peaks: [0.12,0.44,0.75,0.66,0.74,0.27,0.65,0.67,0.55,0.55,0.8,0.52,0.66,0.8,0.32,0.73,0.49,0.6,0.59,0.81,0.74,0.29,0.57,0.64,0.58,0.31,0.8,0.53,0.48,0.67,0.55,0.45,0.63,0.6,0.64,0.55,0.59,0.67,0.64,1.0,0.84,0.74,0.53,0.71,0.38,0.51,0.48,0.12] },

            { file: "12-no-contact", title: "나랑 연락이 안 될 때", duration: 26.99, peaks: [0.12,0.12,0.46,0.66,0.81,0.67,1.0,0.76,0.8,0.49,0.5,0.65,0.96,0.67,0.74,0.71,0.32,0.52,0.71,0.63,0.7,0.65,0.65,0.14,0.68,0.7,0.39,0.4,0.8,0.76,0.74,0.73,0.48,0.12,0.97,0.55,0.47,0.55,0.84,0.65,0.69,0.69,0.36,0.7,0.38,0.61,0.32,0.12] },
            { file: "13-upset", title: "나한테 서운할 때", duration: 26.81, peaks: [0.12,0.12,0.45,0.42,0.62,0.37,0.35,0.5,0.55,0.27,0.12,1.0,0.4,0.37,0.41,0.28,0.56,0.38,0.52,0.19,0.44,0.5,0.35,0.6,0.54,0.39,0.12,0.12,0.48,0.45,0.39,0.33,0.52,0.12,0.52,0.41,0.37,0.45,0.35,0.43,0.37,0.12,0.32,0.4,0.45,0.49,0.17,0.12] },
            { file: "14-long-days", title: "남은 날이 너무 길게 느껴질 때", duration: 17.77, peaks: [0.12,0.12,0.12,0.8,0.81,1.0,0.78,0.39,0.69,0.78,0.59,0.81,0.8,0.77,0.75,0.3,0.69,0.84,0.6,0.12,0.12,0.83,0.75,0.7,0.12,0.47,0.91,0.88,0.21,0.12,0.6,0.64,0.61,0.62,0.35,0.66,0.8,0.22,0.12,0.12,0.36,0.73,0.6,0.29,0.41,0.63,0.12,0.12] },
          ],
        },
      ];

      const voices = groups.flatMap((group) => group.voices);
      const audio = document.querySelector("[data-audio]");
      const range = document.querySelector("[data-range]");
      const toggleButton = document.querySelector("[data-action='toggle']");
      const ui = {
        number: document.querySelector("[data-player-number]"),
        state: document.querySelector("[data-player-state]"),
        title: document.querySelector("[data-player-title]"),
        current: document.querySelector("[data-time-current]"),
        total: document.querySelector("[data-time-total]"),
      };

      const pad = (n) => String(n).padStart(2, "0");
      const formatTime = (seconds) => {
        const s = Math.max(0, Math.floor(seconds));
        return `${Math.floor(s / 60)}:${pad(s % 60)}`;
      };

      // Build the cards.
      const bars = (peaks) => peaks.map((h) => `<i style="--h:${h}"></i>`).join("");
      let number = 0;
      document.querySelector("[data-groups]").innerHTML = groups.map((group) => `
        <section class="voice-group">
          <header class="voice-group-head">
            <p>${group.label}</p>
            <h2>${group.title}</h2>
          </header>
          <ol class="voice-list">
            ${group.voices.map((voice) => {
              const index = number++;
              return `
                <li>
                  <button class="voice-card" type="button" data-index="${index}" aria-label="${voice.title} 듣기, ${formatTime(voice.duration)}">
                    <span class="voice-card-top">
                      <span class="voice-number">${pad(index + 1)}</span>
                      <span class="voice-duration">${formatTime(voice.duration)}</span>
                      ${voice.lock ? `<span class="voice-lock">${voice.lock.badge}</span>` : ""}
                    </span>
                    <span class="voice-title">${voice.title}</span>
                    <span class="voice-bottom">
                      <span class="voice-play" aria-hidden="true">
                        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8.5 5.5v13l10.5-6.5z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
                        <svg class="icon-lock" viewBox="0 0 24 24"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v11h-13V10zm2 0h6V7.5a3 3 0 0 0-6 0z"/></svg>
                      </span>
                      <span class="voice-wave" aria-hidden="true">
                        <span class="wave-bars">${bars(voice.peaks)}</span>
                        <span class="wave-bars wave-played">${bars(voice.peaks)}</span>
                      </span>
                    </span>
                  </button>
                </li>`;
            }).join("")}
          </ol>
        </section>`).join("");

      const cards = [...document.querySelectorAll(".voice-card")];

      // Playback state.
      let index = 0;
      let loaded = false;
      let scrubbing = false;
      let frame = 0;

      // Date locks. Checked against the viewer's clock each time a voice is picked.
      const gate = document.querySelector("[data-gate]");
      const gateButtons = {
        ok: gate.querySelector("[data-gate-ok]"),
        yes: gate.querySelector("[data-gate-yes]"),
        no: gate.querySelector("[data-gate-no]"),
      };
      const gateMessages = {
        wait: { note: "2026년 11월 15일에 열려", text: "듣고싶은건 알겠지만! 조금만 기다려줘!" },
        ask: { note: "2027년 9월 15일에 열려", text: "9월 15일이 아닌데도 듣고싶어? ㅎㅎ 귀엽네" },
      };
      let onYes = null;
      let gateReturnFocus = null;

      const isLocked = (i) => Boolean(voices[i].lock && Date.now() < voices[i].lock.opensAt);

      function refreshLocks() {
        cards.forEach((card, i) => {
          const locked = isLocked(i);
          card.classList.toggle("is-locked", locked);
          card.setAttribute("aria-label", `${voices[i].title} ${locked ? "잠겨 있음" : "듣기"}, ${formatTime(voices[i].duration)}`);
        });
      }

      function openGate(mode, yes) {
        const message = gateMessages[mode];
        gate.querySelector("[data-gate-note]").textContent = message.note;
        gate.querySelector("[data-gate-text]").textContent = message.text;
        gateButtons.ok.hidden = mode !== "wait";
        gateButtons.yes.hidden = gateButtons.no.hidden = mode !== "ask";
        onYes = yes;
        gateReturnFocus = document.activeElement;
        gate.hidden = false;
        gate.classList.remove("is-open");
        void gate.offsetWidth;
        gate.classList.add("is-open");
        (mode === "wait" ? gateButtons.ok : gateButtons.yes).focus();
      }

      function closeGate() {
        if (gate.hidden) return;
        gate.hidden = true;
        gate.classList.remove("is-open");
        onYes = null;
        gateReturnFocus?.focus();
      }

      gateButtons.ok.addEventListener("click", closeGate);
      gateButtons.no.addEventListener("click", closeGate);
      gateButtons.yes.addEventListener("click", () => {
        const yes = onYes;
        closeGate();
        yes?.();
      });
      gate.addEventListener("click", (event) => {
        if (event.target === gate) closeGate();
      });
      setInterval(refreshLocks, 30000);
      refreshLocks();

      const play = () => audio.play().catch(renderPlaying);
      const duration = () => (Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : voices[index].duration);

      function renderProgress() {
        const time = scrubbing ? Number(range.value) : audio.currentTime;
        const progress = Math.min(1, time / duration());
        if (!scrubbing) range.value = time;
        range.style.setProperty("--p", progress);
        cards[index].style.setProperty("--p", progress);
        ui.current.textContent = formatTime(time);
      }

      function renderTrack() {
        const voice = voices[index];
        ui.number.textContent = pad(index + 1);
        ui.title.textContent = voice.title;
        ui.total.textContent = formatTime(voice.duration);
        range.max = voice.duration;
        cards.forEach((card, i) => {
          card.classList.toggle("is-current", loaded && i === index);
          if (i !== index) card.style.setProperty("--p", 0);
        });
        renderProgress();
      }

      function renderPlaying() {
        const playing = !audio.paused;
        document.body.classList.toggle("is-playing", playing);
        cards.forEach((card, i) => card.classList.toggle("is-playing", playing && i === index));
        toggleButton.setAttribute("aria-label", playing ? "일시정지" : "재생");
        ui.state.textContent = playing ? "지금 듣는 중" : audio.ended ? "다 들었어" : loaded ? "잠시 멈춤" : "들을 음성을 골라줘";
      }

      // Returns false when a date lock stopped the voice from loading.
      function select(i, autoplay, granted = false) {
        const target = (i + voices.length) % voices.length;
        refreshLocks();
        if (isLocked(target) && !granted) {
          const { mode } = voices[target].lock;
          openGate(mode, mode === "ask" ? () => select(target, true, true) : null);
          return false;
        }
        index = target;
        audio.src = `assets/voice/${voices[index].file}.m4a`;
        loaded = true;
        renderTrack();
        renderPlaying();
        if (autoplay) play();
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: voices[index].title, artist: "해뚱이", album: "우리의 음성함" });
        }
        return true;
      }

      function toggle() {
        if (!loaded) return select(index, true);
        audio.paused ? play() : audio.pause();
      }

      function seek(seconds) {
        if (!loaded && !select(index, false)) return;
        audio.currentTime = Math.min(Math.max(0, seconds), duration());
        renderProgress();
      }

      function previous() {
        // Like most players: restart the current voice first, then go back.
        if (loaded && audio.currentTime > 3) return seek(0);
        select(index - 1, loaded && !audio.paused);
      }

      const next = () => select(index + 1, loaded && !audio.paused);

      cards.forEach((card, i) => {
        card.addEventListener("click", () => (i === index && loaded ? toggle() : select(i, true)));
      });

      const actions = {
        toggle,
        prev: previous,
        next,
        back: () => seek(audio.currentTime - 10),
        forward: () => seek(audio.currentTime + 10),
      };
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => actions[button.dataset.action]());
      });

      range.addEventListener("pointerdown", () => (scrubbing = true));
      range.addEventListener("input", () => {
        if (!loaded && !select(index, false)) {
          scrubbing = false;
          return renderProgress();
        }
        audio.currentTime = Number(range.value);
        renderProgress();
      });
      range.addEventListener("change", () => {
        scrubbing = false;
        renderProgress();
      });
      addEventListener("pointerup", () => (scrubbing = false));

      function tick() {
        renderProgress();
        frame = requestAnimationFrame(tick);
      }

      audio.addEventListener("play", () => {
        renderPlaying();
        cancelAnimationFrame(frame);
        tick();
      });
      audio.addEventListener("pause", () => {
        cancelAnimationFrame(frame);
        renderPlaying();
        renderProgress();
      });
      audio.addEventListener("ended", () => {
        // An early "예" only covers one listen: playing it again asks again.
        if (isLocked(index)) loaded = false;
        renderPlaying();
      });
      audio.addEventListener("loadedmetadata", () => {
        range.max = duration();
        renderProgress();
      });

      // Space toggles playback; arrow keys skip 10 seconds (unless a control has focus).
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") return closeGate();
        if (!gate.hidden) return;
        if (event.target.closest("input, button, a") || event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.code === "Space") {
          event.preventDefault();
          toggle();
        } else if (event.key === "ArrowLeft") {
          actions.back();
        } else if (event.key === "ArrowRight") {
          actions.forward();
        }
      });

      // Lock-screen and headphone controls on phones.
      if ("mediaSession" in navigator) {
        const handlers = {
          play,
          pause: () => audio.pause(),
          previoustrack: previous,
          nexttrack: next,
          seekbackward: actions.back,
          seekforward: actions.forward,
          seekto: (details) => seek(details.seekTime),
        };
        for (const [name, handler] of Object.entries(handlers)) {
          try {
            navigator.mediaSession.setActionHandler(name, handler);
          } catch {}
        }
      }

      renderTrack();
      renderPlaying();
    </script>
  </body>
</html>
