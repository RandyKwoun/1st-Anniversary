<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf8f3">
    <meta name="description" content="오늘 뭐 먹을지 고민될 때 돌려 보는 메뉴 룰렛.">
    <title>오늘의 메뉴 추천</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="menu-page">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="홈">H <span>&</span> N</a>
      <a class="header-link" href="index.html"><span aria-hidden="true">←</span> 처음으로</a>
    </header>

    <main>
      <section class="timeline-intro menu-intro" aria-labelledby="menu-title">
        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> WHAT TO EAT</p>
        <h1 id="menu-title">오늘의<br><span>메뉴 추천</span></h1>
        <p class="menu-note">또 말차마시고 끝내지 말고! 밥먹어 밥!!!</p>
      </section>

      <section class="roulette" aria-label="메뉴 룰렛">
        <div class="roulette-stage">
          <span class="roulette-pointer" aria-hidden="true"></span>
          <svg class="roulette-wheel" viewBox="-160 -160 320 320" aria-hidden="true" data-wheel></svg>
          <button class="roulette-spin" type="button" data-spin>돌려!</button>
        </div>
        <p class="roulette-hint">가운데 버튼을 눌러봐</p>

        <details class="menu-editor">
          <summary>메뉴 넣고 빼기 <span class="menu-count" data-count></span></summary>
          <ul class="menu-items" data-items></ul>
          <form class="menu-add" data-add-form>
            <input name="label" maxlength="10" placeholder="메뉴 (예: 떡볶이)" aria-label="룰렛에 적을 메뉴 이름" required>
            <input name="text" maxlength="40" placeholder="한마디 (안 적어도 돼)" aria-label="결과에 보여줄 한마디">
            <button type="submit">넣기</button>
          </form>
          <p class="menu-editor-message" aria-live="polite" data-message></p>
          <div class="menu-editor-foot">
            <p>바꾼 메뉴는 지금 쓰는 폰(브라우저)에 저장돼.</p>
            <button type="button" data-reset>처음 메뉴로 되돌리기</button>
          </div>
        </details>
      </section>
    </main>

    <footer class="timeline-footer">
      <a class="wordmark" href="index.html">H <span>&</span> N</a>
    </footer>

    <div class="reveal" role="dialog" aria-modal="true" aria-labelledby="reveal-title" hidden data-reveal>
      <div class="reveal-confetti" aria-hidden="true" data-confetti></div>
      <div class="reveal-card">
        <p class="reveal-menu" id="reveal-title" data-result></p>
        <div class="reveal-actions">
          <button class="primary-link" type="button" data-again>
            <span>한 번 더 돌리기</span>
            <span class="link-arrow" aria-hidden="true">↻</span>
          </button>
          <button class="secondary-link" type="button" data-close>
            <span>좋아, 이걸로!</span>
            <span class="link-arrow" aria-hidden="true">♥</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const defaultMenus = [
        { label: "화덕피자", text: "Ocean View에서 화덕피자!" },
        { label: "마라탕", text: "마라탕 배달 시켜먹기~" },
        { label: "불고기", text: "K-Central가서 불고기 어때?" },
        { label: "포케볼", text: "오늘은 Makai에서 포케볼이 딱이다! (ㅇㅈㅇㅈ)" },
        { label: "Crave", text: "건강하게 이번엔 Crave가자!" },
        { label: "라면", text: "귀찮은데…오늘은 집에서 라면이닷!" },
        { label: "Soba", text: "찾아보니 Noodles의 Soba Shrimp가 그렇게 맛있대!" },
        { label: "태국음식", text: "태국음식은 어떤가용 울 공쥬님? ㅎㅎ" },
      ];
      const STORAGE_KEY = "menu-roulette";
      const MIN_MENUS = 2;
      const MAX_MENUS = 12;

      const wheel = document.querySelector("[data-wheel]");
      const spinButton = document.querySelector("[data-spin]");
      const reveal = document.querySelector("[data-reveal]");
      const result = document.querySelector("[data-result]");
      const confetti = document.querySelector("[data-confetti]");
      const itemList = document.querySelector("[data-items]");
      const addForm = document.querySelector("[data-add-form]");
      const count = document.querySelector("[data-count]");
      const message = document.querySelector("[data-message]");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const SVG_NS = "http://www.w3.org/2000/svg";

      function loadMenus() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved) && saved.length >= MIN_MENUS) return saved;
        } catch {}
        return defaultMenus.map((menu) => ({ ...menu }));
      }

      function saveMenus() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(menus));
        } catch {}
      }

      let menus = loadMenus();
      let rotation = 0;
      let last = -1;
      let spinning = false;

      // Draw the wheel: slice i is centred at i * slice degrees, clockwise from the top.
      // Built with DOM nodes (not innerHTML) because menu names can be typed in by hand.
      const radius = 150;
      const point = (deg, r) => {
        const rad = (deg - 90) * (Math.PI / 180);
        return `${(r * Math.cos(rad)).toFixed(2)} ${(r * Math.sin(rad)).toFixed(2)}`;
      };

      function drawWheel() {
        const slice = 360 / menus.length;
        wheel.replaceChildren();
        menus.forEach((menu, i) => {
          const start = i * slice - slice / 2;
          const end = start + slice;
          // With an odd count the last slice would match the first, so give it a third colour.
          const tone = menus.length % 2 === 1 && i === menus.length - 1 ? 2 : i % 2;

          const path = document.createElementNS(SVG_NS, "path");
          path.setAttribute("class", `slice slice-${tone}`);
          path.setAttribute("d", `M0 0 L${point(start, radius)} A${radius} ${radius} 0 0 1 ${point(end, radius)} Z`);

          const label = document.createElementNS(SVG_NS, "text");
          label.setAttribute("class", "slice-label");
          label.setAttribute("transform", `rotate(${i * slice}) translate(0 -104)`);
          label.style.fontSize = `${menus.length > 8 ? 12 : 14}px`;
          label.textContent = menu.label.length > 6 ? `${menu.label.slice(0, 5)}…` : menu.label;

          wheel.append(path, label);
        });
        const rim = document.createElementNS(SVG_NS, "circle");
        rim.setAttribute("class", "wheel-rim");
        rim.setAttribute("r", radius);
        wheel.append(rim);
      }

      function renderEditor() {
        count.textContent = `${menus.length} / ${MAX_MENUS}`;
        itemList.replaceChildren(...menus.map((menu, i) => {
          const item = document.createElement("li");
          const copy = document.createElement("div");
          const name = document.createElement("strong");
          const text = document.createElement("span");
          const remove = document.createElement("button");
          name.textContent = menu.label;
          text.textContent = menu.text;
          remove.type = "button";
          remove.textContent = "×";
          remove.setAttribute("aria-label", `${menu.label} 빼기`);
          remove.disabled = menus.length <= MIN_MENUS;
          remove.addEventListener("click", () => removeMenu(i));
          copy.append(name, text);
          item.append(copy, remove);
          return item;
        }));
        addForm.querySelector("button").disabled = menus.length >= MAX_MENUS;
      }

      function update(note) {
        last = -1;
        saveMenus();
        drawWheel();
        renderEditor();
        message.textContent = note;
      }

      function removeMenu(i) {
        if (spinning || menus.length <= MIN_MENUS) return;
        const [removed] = menus.splice(i, 1);
        update(`'${removed.label}' 뺐어!`);
      }

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (spinning) return;
        if (menus.length >= MAX_MENUS) {
          message.textContent = `메뉴는 ${MAX_MENUS}개까지 넣을 수 있어.`;
          return;
        }
        const label = addForm.label.value.trim();
        const text = addForm.text.value.trim() || `오늘은 ${label}!`;
        if (!label) return;
        menus.push({ label, text });
        addForm.reset();
        update(`'${label}' 넣었어!`);
        addForm.label.focus();
      });

      document.querySelector("[data-reset]").addEventListener("click", () => {
        if (spinning) return;
        menus = defaultMenus.map((menu) => ({ ...menu }));
        update("처음 메뉴로 되돌렸어.");
      });

      function spin() {
        if (spinning) return;
        spinning = true;
        spinButton.disabled = true;
        closeReveal(false);

        // Pick a different menu from last time so it never feels stuck.
        let pick;
        do pick = Math.floor(Math.random() * menus.length);
        while (pick === last && menus.length > 1);
        last = pick;
        const chosen = menus[pick];

        const slice = 360 / menus.length;
        const jitter = (Math.random() - 0.5) * slice * 0.6;
        const target = (360 - pick * slice + jitter + 360) % 360;
        const duration = reduceMotion.matches ? 0 : 4600;
        rotation = rotation - (rotation % 360) + 360 * 6 + target;
        wheel.style.transitionDuration = `${duration}ms`;
        wheel.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => {
          spinning = false;
          spinButton.disabled = false;
          openReveal(chosen.text);
        }, duration + 150);
      }

      function burst() {
        const colors = ["#c87572", "#d3b778", "#e8b4ab", "#a95251", "#efd9a6"];
        confetti.innerHTML = Array.from({ length: 36 }, (_, i) => {
          const angle = (i / 36) * Math.PI * 2 + Math.random() * 0.3;
          const distance = 140 + Math.random() * 160;
          const style = [
            `--x:${(Math.cos(angle) * distance).toFixed(0)}px`,
            `--y:${(Math.sin(angle) * distance).toFixed(0)}px`,
            `--r:${Math.floor(Math.random() * 540)}deg`,
            `--d:${Math.floor(Math.random() * 120)}ms`,
            `background:${colors[i % colors.length]}`,
          ].join(";");
          return `<i style="${style}"></i>`;
        }).join("");
      }

      function openReveal(text) {
        result.textContent = text;
        burst();
        reveal.hidden = false;
        // Restart the entrance animation each time.
        reveal.classList.remove("is-open");
        void reveal.offsetWidth;
        reveal.classList.add("is-open");
        reveal.querySelector("[data-close]").focus();
      }

      function closeReveal(restoreFocus = true) {
        if (reveal.hidden) return;
        reveal.hidden = true;
        reveal.classList.remove("is-open");
        if (restoreFocus) spinButton.focus();
      }

      spinButton.addEventListener("click", spin);
      document.querySelector("[data-again]").addEventListener("click", spin);
      document.querySelector("[data-close]").addEventListener("click", () => closeReveal());
      reveal.addEventListener("click", (event) => {
        if (event.target === reveal) closeReveal();
      });
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeReveal();
      });

      drawWheel();
      renderEditor();
    </script>
  </body>
</html>
